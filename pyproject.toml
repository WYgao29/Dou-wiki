[project]
name = "douyin-wiki"
version = "0.2.1"
description = "抖库：面向 AI Agent 的本地抖音知识库"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28.1,<1",
  "jinja2>=3.1.6,<4",
  "markdown-it-py>=4.0,<5",
  "mcp>=2.2,<3",
  "nh3>=0.3,<1",
  "numpy>=2.1,<3",
  "playwright>=1.54,<2",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "send2trash>=2.1,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
  "watchfiles>=1.1,<2",
]

[project.optional-dependencies]
asr = [
  "mlx-audio==0.5.8 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx==0.32.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==5.19.0",
  "soundfile>=0.12.1,<1",
]
ocr = ["rapidocr>=3.9.2,<4", "onnxruntime>=1.30,<2"]
embeddings = ["sentence-transformers>=6.1,<7"]
mlx = [
  "mlx-audio==0.5.8 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx==0.32.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==5.19.0",
  "soundfile>=0.12.1,<1",
]
qwen3 = [
  "mlx-audio==0.5.8 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx==0.32.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==5.19.0",
  "soundfile>=0.12.1,<1",
]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "httpx2>=2,<3",
  "ruff>=0.12,<1",
]

[project.scripts]
douyin-wiki = "douyin_wiki.cli:main"
douyin-wiki-mcp = "douyin_wiki.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/douyin_wiki"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.pi/**",
  "/.obsidian/**",
  "/.test-*/**",
  "/.codex-tmp/**",
  "/.superpowers/**",
  "/.venv/**",
  "/.worktrees/**",
  "/docs/screenshots/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/htmlcov/**",
  "/dist/**",
  "/build/**",
  "/.env",
  "/.coverage",
  "**/__pycache__/**",
  "**/*.py[cod]",
  "**/*.egg-info/**",
  "**/.DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires network, browser cookies, and real external tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
